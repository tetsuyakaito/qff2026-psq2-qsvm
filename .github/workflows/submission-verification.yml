name: Submission verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      execute_notebook:
        description: Execute solution.ipynb after the standard checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: submission-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the official QML kit environment
        run: python -m pip install --requirement requirements.txt

      - name: Run the official prediction validator
        run: python tools/validate_predictions.py q2 predictions_q2.csv

      - name: Reproduce the official Processor D benchmark
        run: python benchmark/qff_qml_benchmark.py processor_d_config.json

      - name: Run submission verification tests
        run: python -m unittest discover -s tests -v

      # Notebook execution is intentionally opt-in: the committed-output and
      # saved-error checks above are fast, while a complete QML run is costly.
      - name: Execute the solution notebook (manual opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_notebook }}
        run: |
          mkdir -p /tmp/qff-executed-notebook
          timeout --signal=TERM --kill-after=60s 30m \
            jupyter nbconvert \
              --to notebook \
              --execute solution.ipynb \
              --output solution-executed.ipynb \
              --output-dir /tmp/qff-executed-notebook \
              --ExecutePreprocessor.timeout=1200 \
              --ExecutePreprocessor.kernel_name=python3
